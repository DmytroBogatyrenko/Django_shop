{% extends "base.html" %}

{% block title %}Вхід{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">Вхід у систему</h3>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-success w-100 mt-3">Увійти</button>
                    </form>
                    <div class="text-center mt-3">
                        <small>Ще немає акаунту? <a href="{% url 'accounts:register' %}">Зареєструватися</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
