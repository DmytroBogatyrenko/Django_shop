{% extends "base.html" %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">Створення акаунту</h3>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100 mt-3">Зареєструватися</button>
                    </form>
                    <div class="text-center mt-3">
                        <small>Вже є акаунт? <a href="{% url 'accounts:login' %}">Увійти</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
