<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Спортивний магазин{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'shop:product_list' %}">🏃 SportShop</a>
        
        <div class="ms-auto d-flex align-items-center">
        {% if user.is_authenticated %}
            <span class="navbar-text me-3 text-white">
            Ви увійшли як: <strong>{{ user.username }}</strong>
            </span>
            <a href="{% url 'accounts:profile' %}" class="btn btn-outline-light btn-sm me-2">Мій профіль</a>
            <a href="{% url 'orders:order_list' %}" class="btn btn-outline-light btn-sm me-2">Мої замовлення</a>
            <form action="{% url 'accounts:logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-sm">Вийти</button>
            </form>
        {% else %}
            <a href="{% url 'accounts:login' %}" class="btn btn-outline-light btn-sm me-2">Увійти</a>
            <a href="{% url 'accounts:register' %}" class="btn btn-primary btn-sm">Реєстрація</a>
        {% endif %}
        </div>
    </div>
    </nav>

    <div class="container mb-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
